packages:
  - apps/*
  - packages/*
# pnpm 12: dependency build scripts run only when approved here.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: false
  sharp: false
ignoredOptionalDependencies:
  - sharp
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.0'
  - drizzle-orm@0.45.4
  - playwright-core@1.64.0
  - playwright@1.64.0

# The legacy drizzle-kit loader must not retain the vulnerable serve API.
overrides:
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
patchedDependencies:
  '@better-auth/core@1.7.10': patches/@better-auth__core@1.7.10.patch
  postgres@3.4.9: patches/postgres@3.4.9.patch
