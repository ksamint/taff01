      const n = nodes[sel], props = []; let pr = null, canTask = false, canTl = false, tlPid = null, tlTid = null, idTxt = '', blocker = '';
      if (n.type === 'task') {
        const x = n.tk, mm = n.mm, pj = S.PROJECTS.find(p => p.id === x.proj); idTxt = x.id;
        props.push({ k: t.project, v: pj ? pj[lang] : x.proj }, { k: t.owner, v: S.PEOPLE[x.owner] ? S.PEOPLE[x.owner][lang] : '—' });
        if (x.agent && S.PEOPLE[x.agent]) props.push({ k: t.agent, v: S.PEOPLE[x.agent][lang] });
        if (mm) props.push({ k: t.dates, v: `${fmtD(mm.s, zh)} – ${fmtD(mm.s + mm.d - 1, zh)}` });
        props.push({ k: t.status, v: t.st[x.status] });
        pr = mm ? mm.pr : S.pctOf(x); canTask = true; canTl = !!mm; tlPid = x.proj; tlTid = x.id;
        if (x.agentState === 'blocked' && x.blocker) blocker = x.blocker[lang];
      }
      if (n.type === 'project') { const r = md.risks[sel]; const pj = S.PROJECTS.find(p => p.id === sel); props.push({ k: t.company, v: S.ORGS[pj.org][lang] }); if (r) { if (r.amount != null) props.push({ k: t.amount, v: S.money(r.amount, lang) }, { k: t.collected, v: S.money(r.collected, lang) + ' · ' + r.collectedPct + '%' }); props.push({ k: t.delivery, v: r.prog + '%' }, { k: t.forecast, v: fmtD(r.fc, zh) }, { k: t.status, v: t.lv[r.level] }); pr = r.prog; } canTl = true; tlPid = sel; }
      if (n.type === 'human' || n.type === 'agent') props.push({ k: t.role, v: n.person.role[lang] }, { k: t.tasksN, v: String(Object.values(md.raw).filter(r => r.t.owner === sel || r.t.agent === sel).length) });
      if (n.type === 'value') props.push({ k: t.expected, v: n.v.m[lang] });
      if (n.type === 'company') props.push({ k: t.project, v: String(S.PROJECTS.filter(p => p.org === sel).length) });
      const rels = vis.filter(e => e.a === sel || e.b === sel).map(e => { const o = e.a === sel ? e.b : e.a; return { rel: t.rel[e.rel], dir: e.a === sel ? '→' : '←', name: nodes[o].label, type: t.type[nodes[o].type], go: () => this.setState({ sel: o }) }; });
      const taskCb = !!this.props.onOpenTask, tlCb = !!this.props.onOpenTimeline;
      ins = { has: true, type: t.type[n.type], id: idTxt, hasId: !!idTxt, title: n.label, props, hasPr: pr != null, pr: pr || 0, hasBlocker: !!blocker, blocker, relTitle: `${t.relations} · ${rels.length}`, rels,
        canTask, taskCb, taskLink: canTask && !taskCb, taskHref: 'Team Tasks.dc.html#task=' + sel, openTask: () => this.props.onOpenTask && this.props.onOpenTask(sel),
        canTl, tlCb, tlLink: canTl && !tlCb, tlHref: `Team Tasks Module Plan.dc.html#gantt=${tlPid || ''}${tlTid ? ':' + tlTid : ''}`, openTl: () => this.props.onOpenTimeline && this.props.onOpenTimeline(tlPid, tlTid) };
    }
    return { ...base, svg, empty: !ids.length, layouts, chips, legend, ins, projOpts: S.PROJECTS.map(p => ({ id: p.id, label: p[lang] })) };
  }
}
</script>
