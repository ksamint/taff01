name: CI
on:
  push:
    branches: [main, claude/m9-hardening, codex/ui-parity, codex/prototype-release, codex/agent-creation, codex/m9-handoff]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  POSTGRES_PASSWORD: ci-password
  DATABASE_URL: postgres://taff:ci-password@127.0.0.1:55432/taff
  TEST_DATABASE_URL: postgres://taff:ci-password@127.0.0.1:55432/taff_test
  REDIS_URL: redis://127.0.0.1:56379
  AUTH_URL: http://localhost:3000
  AUTH_SECRET: ci-only-secret-with-at-least-32-characters
  API_INTERNAL_URL: http://127.0.0.1:3001
  API_PORT: "3001"
  SEED_DATE: "2026-10-08"
  DEMO_EMAIL: alex@taff.local
  DEMO_PASSWORD: ci-demo-password
  TOKEN_PEPPER: ci-only-pepper-16-chars
  MCP_RATE_LIMIT: "60"
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: taff
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: taff
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U taff -d taff" --health-interval 5s
          --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: printf 'CI=1\n' > .env
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm licence:check
      - name: Create the test database
        run: PGPASSWORD=ci-password psql -h 127.0.0.1 -p 55432 -U taff -d taff -c 'CREATE DATABASE taff_test'
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:server
      - run: pnpm perf:budget
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Signed-in Today LCP guard in all three locales
        run: |
          node dist/runtime/api/api.mjs > api-lcp.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"; wait "$api_pid" || true' EXIT
          for i in $(seq 1 30); do
            kill -0 "$api_pid"
            if curl -sf http://127.0.0.1:3001/api/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3001/api/health
          for locale in en zh-CN zh-HK; do
            LCP_LOCALE="$locale" LCP_RUNS=3 pnpm perf:lcp
          done
      - run: pnpm perf:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-reports/*.report.json
          retention-days: 7
      - name: MCP smoke against the bundled API
        run: |
          node dist/runtime/api/api.mjs > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for i in $(seq 1 30); do
            kill -0 "$api_pid"
            if curl -sf http://127.0.0.1:3001/api/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3001/api/health
          pnpm mcp:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results
            api.log
            api-lcp.log
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: taff
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: taff
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U taff -d taff" --health-interval 5s
          --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: printf 'CI=1\n' > .env
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm build:server
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Behavioral flows edit the seeded fixture; reseeding preserves those edits.
      - name: Approved visual baselines before fixture mutations
        run: |
          index=0
          for screen in shell today projects task-detail review inbox calendar me type search notifications agent team mcp organizations quick-add companies company-detail contacts contact-detail stakeholders timeline relations brief mind home; do
            index=$((index + 1))
            if [ $(((index - 1) % 4 + 1)) -ne "${{ matrix.shard }}" ]; then continue; fi
            UI_SCREEN="$screen" pnpm exec playwright test --config playwright.visual.config.ts
          done
          for screen in companies company-detail contacts contact-detail stakeholders timeline relations brief mind home; do
            index=$((index + 1))
            if [ $(((index - 1) % 4 + 1)) -ne "${{ matrix.shard }}" ]; then continue; fi
            UI_THEME=dark UI_SCREEN="$screen" pnpm exec playwright test --config playwright.visual.config.ts
          done
      - name: Browser flows in en, zh-CN and zh-HK
        run: pnpm e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results
          retention-days: 7
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target == 'web' && 'deploy/Dockerfile.web' || 'deploy/Dockerfile.server' }}
          build-args: TARGET=${{ matrix.target }}
          push: false
          tags: taff-${{ matrix.target }}:ci
