name: Capture visual baselines
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed source commit to capture
        required: true
        type: string
      screens:
        description: Optional space-separated v2 screens; empty captures all 26 light screens plus 60 dark PNGs (188 total)
        required: false
        type: string
        default: ""
      publish:
        description: Also push the captures to branch visual-baselines/<source_sha> (for environments that cannot download artifacts)
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: visual-baseline-capture
  cancel-in-progress: false
env:
  POSTGRES_PASSWORD: ci-password
  DATABASE_URL: postgres://taff:ci-password@127.0.0.1:55432/taff
  TEST_DATABASE_URL: postgres://taff:ci-password@127.0.0.1:55432/taff_test
  REDIS_URL: redis://127.0.0.1:56379
  AUTH_URL: http://localhost:3000
  AUTH_SECRET: ci-only-secret-with-at-least-32-characters
  API_INTERNAL_URL: http://127.0.0.1:3001
  API_PORT: "3001"
  SEED_DATE: "2026-10-08"
  DEMO_EMAIL: alex@taff.local
  DEMO_PASSWORD: ci-demo-password
  TOKEN_PEPPER: ci-only-pepper-16-chars
  MCP_RATE_LIMIT: "60"
  CI: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  CAPTURE_SCREENS: ${{ inputs.screens }}
  CAPTURE_SOURCE_SHA: ${{ inputs.source_sha }}
  CAPTURE_WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  capture:
    # Match CI's browser, Ubuntu font stack and rasterizer, not a Docker host.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: taff
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: taff
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U taff -d taff" --health-interval 5s
          --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - name: Validate the requested commit
        run: '[[ "$CAPTURE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify the detached source
        run: |
          test "$(git rev-parse HEAD)" = "$CAPTURE_SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Validate the selected capture matrix
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {resolveCaptureSelection} from './scripts/ui/capture-selection.mjs';
          const selection = resolveCaptureSelection(process.env.CAPTURE_SCREENS);
          fs.appendFileSync(process.env.GITHUB_ENV, `CAPTURE_SELECTED_SCREENS=${selection.screens.join(' ')}\n`);
          console.log(JSON.stringify(selection));
          JS
      - run: pnpm install --frozen-lockfile
      - run: printf 'CI=1\n' > .env
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm licence:check
      - name: Create the test database
        run: PGPASSWORD=ci-password psql -h 127.0.0.1 -p 55432 -U taff -d taff -c 'CREATE DATABASE taff_test'
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:server
      - run: pnpm perf:budget
      - name: Install CI Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm perf:lighthouse
      - name: Regenerate the selected matrix without changing comparison tolerances
        shell: bash
        run: |
          set -euo pipefail
          # Only this job's disposable checkout is modified. Missing snapshots
          # must be created by successful captures, not inherited from Git.
          rm -rf -- e2e/__screenshots__/ui-v2.spec.ts
          for screen in $CAPTURE_SELECTED_SCREENS; do
            UI_SCREEN="$screen" DEBUG=pw:browser PLAYWRIGHT_JSON_OUTPUT_FILE="capture-results/$screen.json" pnpm exec playwright test --config playwright.visual.config.ts --update-snapshots --reporter=line,json 2>&1 | tee -a visual-browser.log
          done
          for screen in $CAPTURE_SELECTED_SCREENS; do
            case "$screen" in companies|company-detail|contacts|contact-detail|stakeholders|timeline|relations|brief|mind|home) ;; *) continue ;; esac
            UI_THEME=dark UI_SCREEN="$screen" DEBUG=pw:browser PLAYWRIGHT_JSON_OUTPUT_FILE="capture-results/$screen-dark.json" pnpm exec playwright test --config playwright.visual.config.ts --update-snapshots --reporter=line,json 2>&1 | tee -a visual-browser.log
          done
      - name: Dark route captures in all three locales and both viewports
        shell: bash
        run: |
          set -euo pipefail
          # Playwright stops its owned servers after each baseline group.
          # This standalone capture owns fresh process groups and cleans both.
          TAFF_VISUAL_API_CLOCK=ui-v2 setsid node --import ./scripts/ui/visual-clock.mjs dist/runtime/api/api.mjs > dark-api.log 2>&1 &
          api_pid=$!
          setsid pnpm --filter @taff/web start > dark-web.log 2>&1 &
          web_pid=$!
          cleanup() {
            capture_status=$?
            trap - EXIT
            kill -- "-$api_pid" "-$web_pid" 2>/dev/null || true
            wait "$api_pid" "$web_pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 -- "-$api_pid" 2>/dev/null && ! kill -0 -- "-$web_pid" 2>/dev/null; then break; fi
              sleep 0.2
            done
            if kill -0 -- "-$api_pid" 2>/dev/null || kill -0 -- "-$web_pid" 2>/dev/null; then
              echo "Dark capture left an owned server process group running" >&2
              exit 1
            fi
            if curl --max-time 1 -fs "$AUTH_URL/api/health" >/dev/null || curl --max-time 1 -fs "$API_INTERNAL_URL/api/health" >/dev/null; then
              echo "Dark capture server health endpoints remain open after cleanup" >&2
              exit 1
            fi
            echo "Dark capture cleanup verified: both owned process groups stopped and both health endpoints closed"
            exit "$capture_status"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            kill -0 "$api_pid"
            kill -0 "$web_pid"
            if curl --max-time 1 -fs "$API_INTERNAL_URL/api/health" >/dev/null && curl --max-time 1 -fs "$AUTH_URL/api/health" >/dev/null; then break; fi
            sleep 1
          done
          curl --max-time 1 -fs "$API_INTERNAL_URL/api/health"
          curl --max-time 1 -fs "$AUTH_URL/api/health"
          echo "Dark capture startup verified: both owned server processes alive and both health endpoints ready"
          UI_THEME=dark pnpm ui:app-shots docs/ui/screenshots/v021-dark
      - name: English Relations font download regression
        run: PLAYWRIGHT_JSON_OUTPUT_FILE="capture-results/font-network.json" pnpm exec playwright test e2e/font-loading.spec.ts --reporter=line,json
      - name: Font readiness under delayed subsets and late text
        run: PLAYWRIGHT_JSON_OUTPUT_FILE="capture-results/font-readiness.json" pnpm exec playwright test e2e/font-readiness.spec.ts --reporter=line,json
      - name: Native select metrics across fallback and loaded fonts
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=capture-results/native-select-fonts.json pnpm exec playwright test e2e/native-select-fonts.spec.ts --reporter=line,json
      - name: Record native capture and runtime identities
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import cp from 'node:child_process';
          import {resolveCaptureSelection, assertCapturePaths} from './scripts/ui/capture-selection.mjs';
          import {createRequire} from 'node:module';
          const require = createRequire(import.meta.url);
          const selection = resolveCaptureSelection(process.env.CAPTURE_SCREENS);
          const {screens} = selection;
          const darkScreens = "companies company-detail contacts contact-detail stakeholders timeline relations brief mind home".split(" ").filter(screen => screens.includes(screen)).map(screen => `${screen}-dark`);
          const screenResults = [...screens, ...darkScreens].map(screen => {
            const file = `capture-results/${screen}.json`;
            const raw = fs.readFileSync(file);
            const stats = JSON.parse(raw).stats;
            if (stats.expected !== (screen.endsWith("-dark") || screen === "home" ? 6 : 4) || stats.unexpected || stats.skipped || stats.flaky)
              throw new Error(`Capture did not pass all viewport/locale cases: ${screen}`);
            return {screen, stats, sha256: crypto.createHash('sha256').update(raw).digest('hex')};
          });
          function files(dir) {
            return fs.readdirSync(dir, {withFileTypes: true}).flatMap(entry => {
              const name = path.join(dir, entry.name);
              return entry.isDirectory() ? files(name) : name.endsWith('.png') ? [name] : [];
            });
          }
          const captures = files('e2e/__screenshots__/ui-v2.spec.ts').sort().map(file => {
            const raw = fs.readFileSync(file);
            if (raw.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a' || raw.toString('ascii', 12, 16) !== 'IHDR')
              throw new Error(`Invalid native PNG: ${file}`);
            return {file, bytes: raw.length, width: raw.readUInt32BE(16), height: raw.readUInt32BE(20),
              sha256: crypto.createHash('sha256').update(raw).digest('hex')};
          });
          assertCapturePaths(selection, captures.filter(capture => !capture.file.includes('-dark/')).map(capture => capture.file));
          const darkPaths = darkScreens.flatMap(screen => ['phone','desktop'].flatMap(device => ['en','zh-CN','zh-HK'].map(locale => `e2e/__screenshots__/ui-v2.spec.ts/${device}-${locale}-dark/${screen.replace(/-dark$/, '')}.png`))).sort();
          if (JSON.stringify(captures.filter(capture => capture.file.includes('-dark/')).map(capture => capture.file).sort()) !== JSON.stringify(darkPaths))
            throw new Error('Expected every selected dark viewport/locale PNG');
          if (selection.mode === 'all' && captures.length !== 188) throw new Error('Expected all 188 native PNGs');
          const fontNetwork = JSON.parse(fs.readFileSync('capture-results/font-network.json')).stats;
          if (fontNetwork.expected !== 6 || fontNetwork.unexpected || fontNetwork.skipped || fontNetwork.flaky)
            throw new Error('Expected all six English/real-Northwind font network cases');
          const fontReadiness = JSON.parse(fs.readFileSync('capture-results/font-readiness.json')).stats;
          if (fontReadiness.expected !== 3 || fontReadiness.unexpected || fontReadiness.skipped || fontReadiness.flaky)
            throw new Error('Expected all three locale font-readiness matrices');
          const nativeSelectFonts = JSON.parse(fs.readFileSync('capture-results/native-select-fonts.json')).stats;
          if (nativeSelectFonts.expected !== 3 || nativeSelectFonts.unexpected || nativeSelectFonts.skipped || nativeSelectFonts.flaky)
            throw new Error('Expected all three native-select font/metrics matrices');
          fs.writeFileSync('visual-capture-manifest.json', JSON.stringify({
            sourceSha: process.env.CAPTURE_SOURCE_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            workflowSha: process.env.CAPTURE_WORKFLOW_SHA,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            sourceTree: cp.execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding: 'utf8'}).trim(),
            runnerImage: process.env.ImageOS, runnerImageVersion: process.env.ImageVersion,
            os: fs.readFileSync('/etc/os-release', 'utf8'), node: process.version,
            playwright: require('@playwright/test/package.json').version,
            monospace: cp.execFileSync('fc-match', ['monospace'], {encoding: 'utf8'}).trim(),
            fontRuntime: cp.execFileSync('dpkg-query', ['-W', 'fontconfig', 'libfreetype6'], {encoding: 'utf8'}).trim(),
            captureScope: {...selection, darkScreens, expectedTotalPngCount: selection.expectedPngCount + darkPaths.length}, screenResults, fontNetwork, fontReadiness, nativeSelectFonts, captures,
          }, null, 2) + '\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ inputs.source_sha }}
          path: |
            e2e/__screenshots__/ui-v2.spec.ts
            visual-capture-manifest.json
            visual-browser.log
            capture-results
            docs/ui/screenshots/v021-dark
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-capture-${{ inputs.source_sha }}
          path: |
            test-results
            visual-browser.log
            dark-api.log
            dark-web.log
          retention-days: 7
      - name: Publish the captures to a review branch
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="visual-baselines/$CAPTURE_SOURCE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add --force e2e/__screenshots__/ui-v2.spec.ts visual-capture-manifest.json
          git commit --quiet -m "test(visual): captures for $CAPTURE_SOURCE_SHA from run $GITHUB_RUN_ID"
          git push --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
